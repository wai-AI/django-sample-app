apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: django-eks
  region: us-east-1
  version: "1.36"

availabilityZones:
  - us-east-1a
  - us-east-1b

iam:
  withOIDC: true

vpc:
  cidr: 10.20.0.0/16
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: django-arm
    instanceType: t4g.medium
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    volumeType: gp3
    volumeSize: 20
    volumeEncrypted: true
    ssh:
      allow: false
