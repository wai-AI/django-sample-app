replicaCount: 1

image:
  repository: secure-docker
  tag: "1.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: false

persistence:
  enabled: false

autoscaling:
  enabled: false

config:
  DEBUG: "False"
  DB: "postgres"
  DB_HOST: "postgres.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "hc"
  DB_USER: "django_app"
  DB_SSLMODE: "disable"
  SITE_ROOT: "http://localhost:8080"
  ALLOWED_HOSTS: "localhost,127.0.0.1,django,django.django.svc,django.django.svc.cluster.local"

secrets:
  DB_PASSWORD: "example-password"
  SECRET_KEY: "local-test-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz"

networkPolicy:
  enabled: true

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security-tests
          podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: 8080

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
