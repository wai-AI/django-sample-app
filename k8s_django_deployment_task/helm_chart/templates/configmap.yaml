apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DB: {{ .Values.config.DB | quote }}
  DB_HOST: {{ .Values.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  DB_USER: {{ .Values.config.DB_USER | quote }}
  DB_SSLMODE: {{ .Values.config.DB_SSLMODE | quote }}
  DEBUG: {{ .Values.config.DEBUG | quote }}
  SITE_ROOT: {{ .Values.config.SITE_ROOT | quote }}
  ALLOWED_HOSTS: {{ .Values.config.ALLOWED_HOSTS | quote }}
  SECURE_PROXY_SSL_HEADER: {{ .Values.config.SECURE_PROXY_SSL_HEADER | quote }}
