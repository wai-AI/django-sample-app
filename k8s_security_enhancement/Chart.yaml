apiVersion: v2
name: django-sample-app
description: Django Healthchecks with PostgreSQL database
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: cert-manager
    version: v1.13.1
    repository: https://charts.jetstack.io
    condition: bundledCharts.certManager.enabled
  - name: ingress-nginx
    version: 4.8.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: bundledCharts.ingressNginx.enabled
  - name: metrics-server
    version: 3.11.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
    condition: bundledCharts.metricsServer.enabled
