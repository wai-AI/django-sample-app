deployments:
  elasticsearch:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          - name: discovery.type
            value: single-node
          - name: xpack.security.enabled
            value: "false"
          - name: xpack.ml.enabled
            value: "false"
          - name: ES_JAVA_OPTS
            value: "-Xms512m -Xmx512m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
          - containerPort: 9200
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
          - name: data
            mountPath: /usr/share/elasticsearch/data
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: elasticsearch-data

services:
  elasticsearch: 9200

pvcs:
  elasticsearch-data:
    accessModes:
      - ReadWriteOnce
    storageClassName: standard
    resources:
      requests:
        storage: 8Gi
