---
- name: Install application systemd service
  ansible.builtin.template:
    src: healthchecks.service.j2
    dest: /etc/systemd/system/healthchecks.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart application

- name: Enable and start application
  ansible.builtin.systemd_service:
    name: healthchecks
    daemon_reload: true
    enabled: true
    state: started
