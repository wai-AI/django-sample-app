---
- name: Collect application static files
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    argv:
      - "{{ app_venv }}/bin/python"
      - manage.py
      - collectstatic
      - --noinput
    chdir: "{{ app_code_dir }}"
  environment: "{{ django_environment }}"
  no_log: true

- name: Build compressed static assets
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    argv:
      - "{{ app_venv }}/bin/python"
      - manage.py
      - compress
      - --force
    chdir: "{{ app_code_dir }}"
  environment: "{{ django_environment }}"
  no_log: true
